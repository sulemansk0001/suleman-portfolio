<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="ogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogGrad)"/>

  <!-- Subtle circles -->
  <circle cx="1050" cy="150" r="300" fill="#2563EB" opacity="0.1" filter="blur(60px)"/>
  <circle cx="150" cy="500" r="250" fill="#4F46E5" opacity="0.1" filter="blur(60px)"/>

  <!-- Brand badge -->
  <g transform="translate(100, 100)">
    <rect width="70" height="70" rx="20" fill="url(#blueGlow)"/>
    <text x="35" y="48" font-family="Inter, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle">SS</text>
  </g>

  <!-- Name & Title -->
  <text x="100" y="240" font-family="Inter, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">Suleman Shaikh</text>
  <text x="100" y="295" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="#60A5FA">Digital Marketing Executive • BBA International Business</text>

  <!-- Tagline / Headline -->
  <text x="100" y="380" font-family="Inter, sans-serif" font-size="34" font-weight="700" fill="#F4F4F5">"I Help Businesses Grow Through Digital Marketing."</text>

  <!-- Competencies pill badges -->
  <g transform="translate(100, 440)">
    <rect width="120" height="42" rx="12" fill="#27272A" stroke="#3F3F46"/>
    <text x="60" y="26" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#E4E4E7" text-anchor="middle">SEO</text>

    <rect x="140" width="220" height="42" rx="12" fill="#27272A" stroke="#3F3F46"/>
    <text x="250" y="26" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#E4E4E7" text-anchor="middle">WordPress Development</text>

    <rect x="380" width="200" height="42" rx="12" fill="#27272A" stroke="#3F3F46"/>
    <text x="480" y="26" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#E4E4E7" text-anchor="middle">B2B Lead Generation</text>

    <rect x="600" width="210" height="42" rx="12" fill="#27272A" stroke="#3F3F46"/>
    <text x="705" y="26" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#E4E4E7" text-anchor="middle">Social Media Strategy</text>
  </g>

  <!-- Footer branding -->
  <text x="100" y="550" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#71717A">Al Naya International LLC Internship Experience • Verified Portfolio</text>
</svg>
