<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="wpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="url(#wpBg)"/>
  
  <!-- Browser Window Mockup Frame -->
  <g transform="translate(60, 40)">
    <!-- Window Bar -->
    <rect width="480" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.05))"/>
    <rect width="480" height="36" rx="12" fill="#F1F5F9"/>
    <!-- Circles -->
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>
    <!-- URL Bar -->
    <rect x="80" y="8" width="280" height="20" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="92" y="22" font-family="Inter, sans-serif" font-size="10" fill="#64748B">https://company-corporate-site.com</text>

    <!-- Hero Mockup Inside Browser -->
    <rect x="24" y="56" width="240" height="20" rx="4" fill="#1E293B"/>
    <rect x="24" y="86" width="180" height="12" rx="3" fill="#94A3B8"/>
    <rect x="24" y="106" width="140" height="12" rx="3" fill="#CBD5E1"/>
    <rect x="24" y="130" width="90" height="28" rx="6" fill="url(#blueCard)"/>
    <text x="42" y="148" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Explore</text>

    <!-- Side Image Illustration -->
    <rect x="290" y="56" width="166" height="102" rx="8" fill="#DBEAFE"/>
    <circle cx="373" cy="95" r="24" fill="#3B82F6" opacity="0.3"/>
    <polygon points="340,140 373,105 400,135 440,85 450,140" fill="#2563EB" opacity="0.7"/>

    <!-- Bottom Feature Cards (3 columns) -->
    <rect x="24" y="180" width="132" height="70" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="36" y="194" width="40" height="8" rx="2" fill="#2563EB"/>
    <rect x="36" y="210" width="108" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="36" y="224" width="80" height="6" rx="2" fill="#E2E8F0"/>

    <rect x="174" y="180" width="132" height="70" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="186" y="194" width="50" height="8" rx="2" fill="#2563EB"/>
    <rect x="186" y="210" width="108" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="186" y="224" width="80" height="6" rx="2" fill="#E2E8F0"/>

    <rect x="324" y="180" width="132" height="70" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="336" y="194" width="45" height="8" rx="2" fill="#2563EB"/>
    <rect x="336" y="210" width="108" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="336" y="224" width="80" height="6" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Tag Pill Overlaid in Corner -->
  <rect x="80" y="20" width="140" height="26" rx="13" fill="#1E293B"/>
  <text x="150" y="37" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">WordPress &amp; SEO</text>
</svg>
